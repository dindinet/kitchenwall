local_backend: true

backend:
  name: github
  repo: dindinet/wfgbuilder
  branch: main
  base_url: https://wfgmodular.pages.dev/ #url for Oauth app on Github Developer settings
  auth_endpoint: /api/auth
  squash_merges: true
  preview_context: 'cloudflare preview deploy'
  show_preview_links: true

media_library:
  name: cloudinary
  config:
    cloud_name: dklongley
    api_key: 956814941626765

publish_mode: editorial_workflow

media_folder: "/assets/images"
public_folder: "/images"

collections:
  - name: "advanced"
    label: "Advanced Pages"
    folder: "content/advanced"
    create: true
    preview_path: "{{slug}}"
    fields: []